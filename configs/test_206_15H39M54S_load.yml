# This configuration file is a combination of the split configuration files,
#  includes the settings for the algorithm, network, problem and the results.
# In addition, if this is provided by -o or --one,
#  the priority is higher than the split configurations.

algorithm:
  alg_settings:
    end_iter: 300
    stepsize: 'diminishing_stepsize' # can also set: `diminishing` to be 1/(iter+1)
    alg_name:
    - 'DGDAlgorithm'
    - 'BCGDAlgorithm'
    - 'BBAlgorithm'
    blk_size: 3
    wt_plan: 'block_byz'  # if no information, default to be `metropolis-Hastings`.
    verbose: false  # true for mute
    timeout_base: 1.0
    param_init: 10
    byz_msg:
      byz_plan: 'rand'  # rand, flip, time, ones
      byz_mag: 9

network:
  net_settings:
    # New after 2024-07-23 for load network
    load_network: false  # true for load,
    load_filename:  'test_common_network_utils.joblib'
    # The following settings are for generating networks.
    seed: 0
    net_size: 17
    byz_size: 2
    gene_plan: 'ER_graph'
    conn_req: true
    directed_req: false
    ER_p: .97

problem:
  prob_info:
    # New after 2024-07-24 for load problems.
    load_problem: false  # true for load
    load_filename: 'test_common_problem_utils.joblib'
    # settings for generating problems
    seed: 0
    problem_type: 'LeastSquareProblem'
    dimension: 10
    A:
      HessLowerBd: 1.0
      HessUpperBd: 10.  # AHU in config title
    b: [ -50, 50 ]
    c: 0.0

result:
  result_settings:
    record: false
    save: false
    func_eval: true
    dist_lc_opt: true
    load: false
    logging_path: 'logs/test_log.log'
    save_hist: true

